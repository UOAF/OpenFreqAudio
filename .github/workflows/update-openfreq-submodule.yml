name: Update OpenFreq Submodule

on:
  workflow_run:
    workflows: ["Nightly Build"]
    types: [completed]
    branches: [develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-submodule:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OPENFREQ_APP_ID }}
          private-key: ${{ secrets.OPENFREQ_APP_PRIVATE_KEY }}
          owner: UOAF
          repositories: OpenFreq

      - name: Bump submodule pointer in OpenFreq
        env:
          SUBMODULE_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/UOAF/OpenFreq.git openfreq
          cd openfreq
          git checkout develop

          git config user.name "openfreq-submodule-bot[bot]"
          git config user.email "openfreq-submodule-bot[bot]@users.noreply.github.com"

          git update-index --cacheinfo 160000,"$SUBMODULE_SHA",libs/OpenFreqAudio

          if git diff --cached --quiet; then
            echo "Submodule already at $SUBMODULE_SHA, nothing to do"
            exit 0
          fi

          git commit -m "chore: bump OpenFreqAudio to ${SUBMODULE_SHA:0:7}"
          git push origin develop
